server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Todo se resuelve del lado del navegador y no hay pedidos a terceros:
    # con esto la página no puede cargar nada de afuera aunque quiera.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Los assets llevan hash en el nombre: se cachean para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /pelota.svg {
        expires 7d;
        access_log off;
    }

    # index.html nunca se cachea, así un deploy nuevo se ve enseguida.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # La app maneja sus propias direcciones (/g/CODIGO, /unirse, …).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
